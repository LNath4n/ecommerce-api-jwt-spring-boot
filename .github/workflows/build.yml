name: Build y push a ECR

on:
  push:
    branches: [main]

permissions:
  id-token: write
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::181194339446:role/github-actions-ecr
          aws-region: us-east-1

      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            181194339446.dkr.ecr.us-east-1.amazonaws.com/ferreviky:latest
            181194339446.dkr.ecr.us-east-1.amazonaws.com/ferreviky:${{ github.sha }}