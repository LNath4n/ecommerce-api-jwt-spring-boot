name: Test and push to ECR

on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  id-token: write
  contents: read

jobs:
  test:
    name: API tests (Newman)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: ferreviky
          POSTGRES_PASSWORD: pass
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      floci:
        image: floci/floci:latest
        ports: ["4566:4566"]
      mailpit:
        image: axllent/mailpit
        ports: ["1025:1025", "8025:8025"]

    env:
      SPRING_PROFILES_ACTIVE: dev   # enables the Seeder
      SPRING_DOCKER_COMPOSE_ENABLED: "false"   # los services de arriba reemplazan al compose.yaml
      DB_SERVER: localhost
      DB_NAME: ferreviky
      DB_USERNAME: postgres
      DB_PASSWORD: pass
      REDIS_HOST: localhost
      JWT_SECRET_KEY: Y2ktdGVzdC1zZWNyZXQtY2ktdGVzdC1zZWNyZXQtY2ktdGVzdC1zZWNyZXQtMTIzNDU2Nzg5MA==
      CODES_KEY: Y2ktdGVzdC1jb2Rlcy1rZXktMDEyMzQ1Njc4OWFiY2Q=
      CODES_HMAC_KEY: Y2ktdGVzdC1obWFjLWtleS0wMTIzNDU2Nzg5YWJjZGU=
      HEALTH_URL: http://localhost:8080/health

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Run unit tests
        run: ./mvnw -q test

      - name: Build jar
        run: ./mvnw -q -DskipTests package

      - name: Start API in background
        run: nohup java -jar target/*.jar > app.log 2>&1 &

      - name: Wait for API to be healthy
        run: |
          for i in $(seq 1 40); do
            if curl -sf "$HEALTH_URL" > /dev/null; then
              echo "API is up"
              exit 0
            fi
            sleep 3
          done
          echo "API did not start in time"
          cat app.log
          exit 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate fixtures
        run: |
          pip install pillow
          python3 Postman/fixtures/make_fixtures.py
          ls Postman/fixtures | head -20

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run Postman collection
        run: |
          npm install -g newman
          newman run "Postman/Postman Coleccion.postman_collection.json" \
            --working-dir Postman \
            --env-var "baseUrl=http://localhost:8080" \
            --env-var "adminEmail=admin@admin.com" \
            --env-var "adminPassword=1234567890" \
            --reporters cli

      - name: Print app logs on failure
        if: failure()
        run: cat app.log

  build:
    name: Build and push image
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::181194339446:role/github-actions-ecr
          aws-region: us-east-1

      - name: Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            181194339446.dkr.ecr.us-east-1.amazonaws.com/ferreviky:latest
            181194339446.dkr.ecr.us-east-1.amazonaws.com/ferreviky:${{ github.sha }}

  deploy:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-prod
      cancel-in-progress: false
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::181194339446:role/github-actions-ecr
          aws-region: us-east-1

      - name: Desplegar en la EC2 con SSM
        env:
          INSTANCE_ID: i-094a41c2b674756c7
        run: |
          STATE=$(aws ec2 describe-instances --instance-ids $INSTANCE_ID --query 'Reservations[0].Instances[0].State.Name' --output text)
          if [ "$STATE" != "running" ]; then
            echo "::warning::La EC2 está '$STATE'. La imagen ya quedó en ECR y se desplegará cuando arranque."
            exit 0
          fi

          for i in $(seq 1 30); do
            PING=$(aws ssm describe-instance-information --filters Key=InstanceIds,Values=$INSTANCE_ID --query 'InstanceInformationList[0].PingStatus' --output text)
            [ "$PING" = "Online" ] && break
            sleep 10
          done
          [ "$PING" = "Online" ] || { echo "El agente de SSM no está en línea"; exit 1; }

          CMD_ID=$(aws ssm send-command \
            --instance-ids $INSTANCE_ID \
            --document-name AWS-RunShellScript \
            --comment "deploy ${{ github.sha }}" \
            --parameters 'commands=["/home/ec2-user/deploy.sh ${{ github.sha }} ${{ github.run_number }}"]' \
            --timeout-seconds 600 \
            --query Command.CommandId --output text)

          STATUS=Pending
          for i in $(seq 1 60); do
            STATUS=$(aws ssm get-command-invocation --command-id $CMD_ID --instance-id $INSTANCE_ID --query Status --output text 2>/dev/null || echo Pending)
            case $STATUS in Success|Failed|Cancelled|TimedOut) break ;; esac
            sleep 10
          done

          aws ssm get-command-invocation --command-id $CMD_ID --instance-id $INSTANCE_ID --query StandardOutputContent --output text
          aws ssm get-command-invocation --command-id $CMD_ID --instance-id $INSTANCE_ID --query StandardErrorContent --output text
          echo "Estado final: $STATUS"
          [ "$STATUS" = "Success" ]