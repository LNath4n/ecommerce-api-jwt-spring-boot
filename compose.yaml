services:
  redis:
    image: redis:7
    ports:
      - "6379:6379"

  floci:
    image: floci/floci:latest
    ports:
      - "4566:4566"
    volumes:
      - ./floci-data:/app/data
      - /var/run/docker.sock:/var/run/docker.sock

  mailpit:
    image: axllent/mailpit
    ports:
      - "1025:1025"   # SMTP
      - "8025:8025"   # interfaz web