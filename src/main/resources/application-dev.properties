app.cors.allowed-origins=http://localhost:4200

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

app.storage.local-dir=${STORAGE_DIR:./uploads}
app.storage.base-url=${APP_BASE_URL:http://localhost:8080}

springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
logging.level.org.springframework.security=DEBUG
app.security.public-paths-extra=/swagger-ui.html,/swagger-ui/**,/v3/api-docs/**,/uploads/**

app.ratelimit.enabled=false
app.ratelimit.redis.enabled=false

orders.expiration.minutes=5
orders.expiration.check-interval-ms=15000

logging.level.com.ecommerce.FerreViky=DEBUG

app.dynamodb.endpoint=http://localhost:4566
app.dynamodb.create-table=true
app.verification.token-ttl-minutes=3

spring.docker.compose.file=compose.yaml
spring.docker.compose.lifecycle-management=start-only

spring.mail.host=localhost
spring.mail.port=1025
app.frontend.base-url=http://localhost:4200