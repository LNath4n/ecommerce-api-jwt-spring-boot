spring.application.name=FerreViky

# DataSource
spring.datasource.url=jdbc:postgresql://${DB_SERVER}:5432/${DB_NAME}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate               update      create
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

#Aws s3

app.s3.bucket=${S3_BUCKET}
app.s3.region=${AWS_REGION:us-east-1}
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

#Este archivo simplemente es la configuracion de la BD

springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false