app.cors.allowed-origins=https://d23ev6ydugwou7.cloudfront.net

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

app.s3.bucket=${S3_BUCKET}
app.s3.region=${AWS_REGION:us-east-1}

springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false
app.ratelimit.redis.enabled=true

logging.level.root=INFO
logging.level.com.ecommerce.FerreViky=INFO
logging.structured.format.console=ecs

app.dynamodb.region=${AWS_REGION:us-east-1}

spring.docker.compose.enabled=false

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
app.frontend.base-url=https://d23ev6ydugwou7.cloudfront.net